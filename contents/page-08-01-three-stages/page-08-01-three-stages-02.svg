<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The three stages side by side</title>
  <desc>Three columns, assist, operate and automate, each listing where the system runs, who runs it day to day, what the provider does, which businesses it fits, what the business pays, and its exit.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .n { fill:#f1efe8; stroke:#5f5e5a; stroke-width:.6 }
      .c { fill:#eeedfe; stroke:#534ab7; stroke-width:.6 }
      .ai { fill:#e1f5ee; stroke:#0f6e56; stroke-width:.6 }
      .p { fill:#faece7; stroke:#993c1d; stroke-width:.6 }
      .row { fill:#ffffff; stroke:#b4b2a9; stroke-width:.6 }
      .zone { fill:none; stroke:#b4b2a9; stroke-width:1; stroke-dasharray:5 4 }
      .t { font-size:14px; font-weight:600; text-anchor:middle; fill:#2c2c2a }
      .s { font-size:12px; text-anchor:middle; fill:#5f5e5a }
      .k { font-size:11px; font-weight:700; letter-spacing:.06em; fill:#888780 }
      .v { font-size:12px; fill:#2c2c2a }
      .line { fill:none; stroke:#898781; stroke-width:1.5 }
    </style>
  </defs>

  <rect x="14" y="14" width="220" height="528" rx="10" class="zone"/>
  <rect x="24" y="26" width="200" height="56" rx="8" class="n"/>
  <text x="124" y="50" class="t">1. assist</text>
  <text x="124" y="69" class="s">the business runs it</text>
  <rect x="24" y="94" width="200" height="64" rx="8" class="row"/>
  <text x="36" y="113" class="k">RUNS ON</text>
  <text x="36" y="131" class="v">the premises: a server or</text>
  <text x="36" y="147" class="v">mini PC on the office LAN</text>
  <rect x="24" y="168" width="200" height="64" rx="8" class="row"/>
  <text x="36" y="187" class="k">DAY TO DAY</text>
  <text x="36" y="205" class="v">the business's own staff</text>
  <rect x="24" y="242" width="200" height="64" rx="8" class="row"/>
  <text x="36" y="261" class="k">THE PROVIDER</text>
  <text x="36" y="279" class="v">chooses, installs, imports,</text>
  <text x="36" y="295" class="v">trains remotely, supports</text>
  <rect x="24" y="316" width="200" height="64" rx="8" class="row"/>
  <text x="36" y="335" class="k">FITS</text>
  <text x="36" y="353" class="v">staff who can learn it; data</text>
  <text x="36" y="369" class="v">on site; weak internet</text>
  <rect x="24" y="390" width="200" height="64" rx="8" class="row"/>
  <text x="36" y="409" class="k">PAYS</text>
  <text x="36" y="427" class="v">one-off setup, hardware,</text>
  <text x="36" y="443" class="v">support when wanted</text>
  <rect x="24" y="464" width="200" height="64" rx="8" class="p"/>
  <text x="36" y="491" class="v">exit: the staff keep it</text>
  <text x="36" y="507" class="v">running; lessons recorded</text>
  <rect x="250" y="14" width="220" height="528" rx="10" class="zone"/>
  <rect x="260" y="26" width="200" height="56" rx="8" class="c"/>
  <text x="360" y="50" class="t">2. operate</text>
  <text x="360" y="69" class="s">the provider runs it</text>
  <rect x="260" y="94" width="200" height="64" rx="8" class="row"/>
  <text x="272" y="113" class="k">RUNS ON</text>
  <text x="272" y="131" class="v">hosted, used in a browser</text>
  <text x="272" y="147" class="v">from anywhere</text>
  <rect x="260" y="168" width="200" height="64" rx="8" class="row"/>
  <text x="272" y="187" class="k">DAY TO DAY</text>
  <text x="272" y="205" class="v">the provider's people, at</text>
  <text x="272" y="221" class="v">the provider's office</text>
  <rect x="260" y="242" width="200" height="64" rx="8" class="row"/>
  <text x="272" y="261" class="k">THE PROVIDER</text>
  <text x="272" y="279" class="v">implements, employs and</text>
  <text x="272" y="295" class="v">trains the people who run it</text>
  <rect x="260" y="316" width="200" height="64" rx="8" class="row"/>
  <text x="272" y="335" class="k">FITS</text>
  <text x="272" y="353" class="v">staff hard to hire or keep;</text>
  <text x="272" y="369" class="v">several sites; good internet</text>
  <rect x="260" y="390" width="200" height="64" rx="8" class="row"/>
  <text x="272" y="409" class="k">PAYS</text>
  <text x="272" y="427" class="v">setup, then one monthly fee</text>
  <text x="272" y="443" class="v">instead of salaries and cover</text>
  <rect x="260" y="464" width="200" height="64" rx="8" class="p"/>
  <text x="272" y="491" class="v">exit: accounts in its name,</text>
  <text x="272" y="507" class="v">data export at any time</text>
  <rect x="486" y="14" width="220" height="528" rx="10" class="zone"/>
  <rect x="496" y="26" width="200" height="56" rx="8" class="ai"/>
  <text x="596" y="50" class="t">3. automate</text>
  <text x="596" y="69" class="s">machines run the routine</text>
  <rect x="496" y="94" width="200" height="64" rx="8" class="row"/>
  <text x="508" y="113" class="k">RUNS ON</text>
  <text x="508" y="131" class="v">cloud, premises, or both;</text>
  <text x="508" y="147" class="v">models online or on site</text>
  <rect x="496" y="168" width="200" height="64" rx="8" class="row"/>
  <text x="508" y="187" class="k">DAY TO DAY</text>
  <text x="508" y="205" class="v">machines do the routine;</text>
  <text x="508" y="221" class="v">people approve, take exceptions</text>
  <rect x="496" y="242" width="200" height="64" rx="8" class="row"/>
  <text x="508" y="261" class="k">THE PROVIDER</text>
  <text x="508" y="279" class="v">builds the automations,</text>
  <text x="508" y="295" class="v">AI hardware, keeps watch</text>
  <rect x="496" y="316" width="200" height="64" rx="8" class="row"/>
  <text x="508" y="335" class="k">FITS</text>
  <text x="508" y="353" class="v">the same work every day,</text>
  <text x="508" y="369" class="v">written down in stage 2</text>
  <rect x="496" y="390" width="200" height="64" rx="8" class="row"/>
  <text x="508" y="409" class="k">PAYS</text>
  <text x="508" y="427" class="v">setup, hardware if any,</text>
  <text x="508" y="443" class="v">model usage or its own model</text>
  <rect x="496" y="464" width="200" height="64" rx="8" class="p"/>
  <text x="508" y="491" class="v">exit: switch it off; the</text>
  <text x="508" y="507" class="v">people of stage 2 carry on</text>
  <line x1="234" y1="54" x2="248" y2="54" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="470" y1="54" x2="484" y2="54" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="360" y="570" class="s">what never changes: the business chooses the system, its accounts and data stay in its name,</text>
  <text x="360" y="588" class="s">a person can always step in, and every stage can move up, or back down</text>
</svg>
