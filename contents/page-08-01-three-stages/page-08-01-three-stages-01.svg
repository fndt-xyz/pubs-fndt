<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The business's systems, run three ways</title>
  <desc>The business's systems (accounts, sales, stock, people, projects) can be run three ways: by its own staff (assist), by the provider's people from the provider's office (operate), or by machine learning doing the routine with people in the loop (automate). A business moves up a stage or back down; at every stage the accounts and the data stay in its name.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .n { fill:#f1efe8; stroke:#5f5e5a; stroke-width:.6 }
      .c { fill:#eeedfe; stroke:#534ab7; stroke-width:.6 }
      .ai { fill:#e1f5ee; stroke:#0f6e56; stroke-width:.6 }
      .p { fill:#faece7; stroke:#993c1d; stroke-width:.6 }
      .t { font-size:14px; font-weight:600; text-anchor:middle; fill:#2c2c2a }
      .s { font-size:12px; text-anchor:middle; fill:#5f5e5a }
      .l { font-size:12px; fill:#52514e }
      .line { fill:none; stroke:#898781; stroke-width:1.5 }
    </style>
  </defs>

  <rect x="250" y="20" width="220" height="72" rx="8" class="n"/>
  <text x="360" y="44" class="t">The business's systems</text>
  <text x="360" y="63" class="s">accounts, sales, stock,</text>
  <text x="360" y="78" class="s">people, projects</text>

  <path d="M300 92 L300 112 L130 112 L130 132" class="line" marker-end="url(#a)"/>
  <line x1="360" y1="92" x2="360" y2="132" class="line" marker-end="url(#a)"/>
  <path d="M420 92 L420 112 L590 112 L590 132" class="line" marker-end="url(#a)"/>
  <text x="478" y="106" class="l">who runs it?</text>

  <rect x="20" y="134" width="220" height="72" rx="8" class="n"/>
  <text x="130" y="158" class="t">1. assist</text>
  <text x="130" y="177" class="s">the business's own staff;</text>
  <text x="130" y="192" class="s">a provider installs and teaches</text>

  <rect x="250" y="134" width="220" height="72" rx="8" class="c"/>
  <text x="360" y="158" class="t">2. operate</text>
  <text x="360" y="177" class="s">the provider's people run the</text>
  <text x="360" y="192" class="s">routine, from the provider's office</text>

  <rect x="480" y="134" width="220" height="72" rx="8" class="ai"/>
  <text x="590" y="158" class="t">3. automate</text>
  <text x="590" y="177" class="s">machine learning does the routine;</text>
  <text x="590" y="192" class="s">people stay in the loop</text>

  <line x1="240" y1="170" x2="248" y2="170" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="470" y1="170" x2="478" y2="170" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M130 206 L130 320 L248 320" class="line" marker-end="url(#a)"/>
  <path d="M590 206 L590 320 L472 320" class="line" marker-end="url(#a)"/>
  <path d="M360 206 L360 270" class="line" marker-end="url(#a)"/>
  <rect x="270" y="216" width="180" height="36" fill="#ffffff"/>
  <text x="360" y="230" class="s">up a stage when ready,</text>
  <text x="360" y="246" class="s">back down when needed</text>

  <rect x="250" y="272" width="220" height="96" rx="8" class="p"/>
  <text x="360" y="295" class="t">An exit at every stage</text>
  <text x="360" y="314" class="s">accounts and data in the</text>
  <text x="360" y="330" class="s">business's name, procedures</text>
  <text x="360" y="346" class="s">written down, automation</text>
  <text x="360" y="362" class="s">a switch</text>

  <text x="360" y="398" class="s" font-style="italic">the technology is the easy part;</text>
  <text x="360" y="415" class="s" font-style="italic">who runs it every day decides the stage</text>
</svg>
