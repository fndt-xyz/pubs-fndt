  <title
     id="title1">Three ways to run the same hub: by the business, by the provider, then A2A (agent to agent)</title>
  <desc
     id="desc1">Stage 1: the business owns the server and pays the AI; its own staff watch the dashboard, and the provider installs and trains remotely. Stage 2: the provider runs the hub and its people watch the dashboard and the AI; the business staff are called in only for what only they can decide. Stage 3, A2A (agent to agent): client go talk to their bot, talk to merchant bot, talk to merchant; they never ever, talking back together.</desc>
