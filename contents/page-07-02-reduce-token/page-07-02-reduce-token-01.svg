<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>How a chat message is answered, and where the AI is kept out</title>
  <desc>A customer message passes a may-we-answer check, then code matching against saved answers, which answers most messages with no AI at all. Only unclear messages go to a language model, with the closest saved answers and a few recent lines; a web search runs only for current topics within a daily limit. Code checks every reply before it is sent; anything that fails becomes a holding reply and a team alert.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .n { fill:#f1efe8; stroke:#5f5e5a; stroke-width:.6 }
      .c { fill:#eeedfe; stroke:#534ab7; stroke-width:.6 }
      .ai { fill:#e1f5ee; stroke:#0f6e56; stroke-width:.6 }
      .p { fill:#faece7; stroke:#993c1d; stroke-width:.6 }
      .t { font-size:14px; font-weight:600; text-anchor:middle; fill:#2c2c2a }
      .s { font-size:12px; text-anchor:middle; fill:#5f5e5a }
      .l { font-size:12px; fill:#52514e }
      .save { font-size:11.5px; fill:#0f6e56 }
      .line { fill:none; stroke:#898781; stroke-width:1.5 }
      .tip { fill:#ffffff; stroke:#0f6e56; stroke-width:.6; stroke-dasharray:3 3 }
    </style>
  </defs>

  <!-- customer message -->
  <rect x="200" y="20" width="240" height="56" rx="8" class="n"/>
  <text x="320" y="43" class="t">Customer message</text>
  <text x="320" y="62" class="s">any chat app the business uses</text>
  <line x1="320" y1="76" x2="320" y2="106" class="line" marker-end="url(#a)"/>

  <!-- may we answer -->
  <rect x="200" y="108" width="240" height="56" rx="8" class="c"/>
  <text x="320" y="131" class="t">May the code answer now?</text>
  <text x="320" y="150" class="s">a person just replied, paused, night</text>
  <line x1="440" y1="136" x2="478" y2="136" class="line" marker-end="url(#a)"/>
  <rect x="480" y="108" width="210" height="56" rx="8" class="n"/>
  <text x="585" y="131" class="t">Wait, keep the message</text>
  <text x="585" y="150" class="s">answered later, unless a person did</text>
  <line x1="320" y1="164" x2="320" y2="194" class="line" marker-end="url(#a)"/>

  <!-- stage 1 -->
  <rect x="200" y="196" width="240" height="56" rx="8" class="c"/>
  <text x="320" y="219" class="t">1. Saved answers</text>
  <text x="320" y="238" class="s">keyword match in code, both languages</text>
  <rect x="480" y="196" width="210" height="56" rx="8" class="tip"/>
  <text x="492" y="217" class="save">No AI at all: most messages</text>
  <text x="492" y="233" class="save">end here (greetings, hours,</text>
  <text x="492" y="249" class="save">prices, booking, thanks)</text>

  <!-- clear match path -->
  <path d="M200 224 L150 224 L150 540 L198 540" class="line" marker-end="url(#a)"/>
  <text x="142" y="380" class="l" text-anchor="end">clear match</text>
  <line x1="320" y1="252" x2="320" y2="294" class="line" marker-end="url(#a)"/>
  <text x="330" y="278" class="l">no clear match</text>

  <!-- stage 2 -->
  <rect x="200" y="296" width="240" height="64" rx="8" class="ai"/>
  <text x="320" y="319" class="t">2. Language model</text>
  <text x="320" y="337" class="s">picks a saved answer, or writes</text>
  <text x="320" y="352" class="s">a short one from the business facts</text>
  <rect x="480" y="296" width="210" height="64" rx="8" class="tip"/>
  <text x="492" y="316" class="save">Sent only the closest saved</text>
  <text x="492" y="332" class="save">answers and a few recent lines,</text>
  <text x="492" y="348" class="save">answers in a short fixed form</text>

  <!-- stage 3 -->
  <line x1="320" y1="360" x2="320" y2="390" class="line" marker-end="url(#a)"/>
  <rect x="200" y="392" width="240" height="64" rx="8" class="ai"/>
  <text x="320" y="415" class="t">3. Web search (rare)</text>
  <text x="320" y="433" class="s">only a current topic: a trend, a new</text>
  <text x="320" y="448" class="s">version; adds 1 or 2 sentences</text>
  <rect x="480" y="392" width="210" height="64" rx="8" class="tip"/>
  <text x="492" y="412" class="save">A daily limit per channel and</text>
  <text x="492" y="428" class="save">an off switch on the dashboard;</text>
  <text x="492" y="444" class="save">never for prices or own facts</text>

  <!-- check -->
  <line x1="320" y1="456" x2="320" y2="510" class="line" marker-end="url(#a)"/>
  <rect x="200" y="512" width="240" height="56" rx="8" class="c"/>
  <text x="320" y="535" class="t">4. Code check</text>
  <text x="320" y="554" class="s">prices, links, form, honesty</text>

  <!-- outcomes -->
  <path d="M320 568 L320 590 L230 590 L230 612" class="line" marker-end="url(#a)"/>
  <path d="M320 590 L470 590 L470 612" class="line" marker-end="url(#a)"/>
  <rect x="120" y="614" width="220" height="56" rx="8" class="n"/>
  <text x="230" y="637" class="t">Send the reply</text>
  <text x="230" y="656" class="s">at a human pace</text>
  <rect x="370" y="614" width="200" height="56" rx="8" class="p"/>
  <text x="470" y="637" class="t">Holding reply</text>
  <text x="470" y="656" class="s">it failed, or needs a person</text>
  <line x1="470" y1="670" x2="470" y2="700" class="line" marker-end="url(#a)"/>
  <path d="M230 670 L230 730 L368 730" class="line" marker-end="url(#a)"/>
  <text x="240" y="712" class="l">if flagged</text>
  <rect x="370" y="702" width="200" height="56" rx="8" class="p"/>
  <text x="470" y="725" class="t">Team alert</text>
  <text x="470" y="744" class="s">dashboard and email</text>

  <rect x="20" y="776" width="12" height="12" rx="2" class="c"/><text x="38" y="786" class="l">plain code</text>
  <rect x="120" y="776" width="12" height="12" rx="2" class="ai"/><text x="138" y="786" class="l">AI, called only when code cannot decide</text>
  <rect x="408" y="776" width="12" height="12" rx="2" class="p"/><text x="426" y="786" class="l">a person is needed</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
