<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 668" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>The parts of a self-hosted chat assistant, and what passes between them</title>
  <desc>One service on an office server is the brain. Open-source libraries connect it to the chat apps; a web dashboard on the office network shows the chats and holds the switches; plain text files hold the business facts, saved answers and rules; plain files keep every chat. Only when code cannot decide does the brain call an online language model or a web search. Alerts go out by ordinary email.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .n { fill:#f1efe8; stroke:#5f5e5a; stroke-width:.6 }
      .c { fill:#eeedfe; stroke:#534ab7; stroke-width:.6 }
      .ai { fill:#e1f5ee; stroke:#0f6e56; stroke-width:.6 }
      .p { fill:#faece7; stroke:#993c1d; stroke-width:.6 }
      .zone { fill:none; stroke:#b4b2a9; stroke-width:1; stroke-dasharray:5 4 }
      .t { font-size:14px; font-weight:600; text-anchor:middle; fill:#2c2c2a }
      .s { font-size:12px; text-anchor:middle; fill:#5f5e5a }
      .z { font-size:11px; font-weight:700; letter-spacing:.08em; fill:#888780 }
      .l { font-size:11.5px; fill:#52514e }
      .line { fill:none; stroke:#898781; stroke-width:1.5 }
      .thin { fill:none; stroke:#898781; stroke-width:1.2; stroke-dasharray:4 3 }
    </style>
  </defs>

  <!-- internet zone -->
  <rect x="14" y="14" width="692" height="110" rx="10" class="zone"/>
  <text x="28" y="34" class="z">INTERNET</text>
  <rect x="34" y="46" width="200" height="62" rx="8" class="n"/>
  <text x="134" y="70" class="t">Chat apps</text>
  <text x="134" y="88" class="s">customers write here</text>
  <rect x="262" y="46" width="200" height="62" rx="8" class="ai"/>
  <text x="362" y="70" class="t">Language model API</text>
  <text x="362" y="88" class="s">first AI, only when needed</text>
  <rect x="490" y="46" width="200" height="62" rx="8" class="ai"/>
  <text x="590" y="70" class="t">Web search API</text>
  <text x="590" y="88" class="s">second AI, current topics</text>

  <!-- office server zone -->
  <rect x="14" y="146" width="692" height="350" rx="10" class="zone"/>
  <text x="28" y="166" class="z">OFFICE SERVER (Linux, always on)</text>

  <!-- adapters -->
  <rect x="34" y="182" width="200" height="72" rx="8" class="c"/>
  <text x="134" y="206" class="t">Channel adapters</text>
  <text x="134" y="224" class="s">one per chat account, built</text>
  <text x="134" y="239" class="s">on open-source libraries</text>

  <!-- brain -->
  <rect x="262" y="182" width="200" height="150" rx="10" class="c" stroke-width="1.4"/>
  <text x="362" y="208" class="t">The hub</text>
  <text x="362" y="226" class="s">one JavaScript service, the brain</text>
  <text x="362" y="250" class="s">saved answers first,</text>
  <text x="362" y="266" class="s">AI only when code can't decide,</text>
  <text x="362" y="282" class="s">every reply checked,</text>
  <text x="362" y="298" class="s">human pace, holds, flags</text>
  <text x="362" y="320" class="s" font-style="italic">open-source runtime and modules</text>

  <!-- tuning files -->
  <rect x="490" y="182" width="200" height="72" rx="8" class="n"/>
  <text x="590" y="206" class="t">Tuning files</text>
  <text x="590" y="224" class="s">business facts, saved answers,</text>
  <text x="590" y="239" class="s">rules per channel (plain text)</text>

  <!-- data files -->
  <rect x="490" y="276" width="200" height="72" rx="8" class="n"/>
  <text x="590" y="300" class="t">Chat files</text>
  <text x="590" y="318" class="s">one file per chat, only added to;</text>
  <text x="590" y="333" class="s">edits and deletions kept</text>

  <!-- email -->
  <rect x="34" y="276" width="200" height="72" rx="8" class="p"/>
  <text x="134" y="300" class="t">Email alerts</text>
  <text x="134" y="318" class="s">ordinary mail client, to</text>
  <text x="134" y="333" class="s">the person on duty</text>

  <!-- dashboard -->
  <rect x="262" y="384" width="200" height="96" rx="8" class="c"/>
  <text x="362" y="408" class="t">Dashboard (web page)</text>
  <text x="362" y="426" class="s">chats, reply by hand, drafts,</text>
  <text x="362" y="441" class="s">switches: pause a chat, learning,</text>
  <text x="362" y="456" class="s">web search, hide; save answers</text>

  <!-- office network zone -->
  <rect x="14" y="518" width="692" height="104" rx="10" class="zone"/>
  <text x="28" y="538" class="z">OFFICE NETWORK</text>
  <rect x="262" y="548" width="200" height="60" rx="8" class="n"/>
  <text x="362" y="572" class="t">A person's browser</text>
  <text x="362" y="590" class="s">laptop or phone, with a password</text>

  <!-- links -->
  <line x1="134" y1="108" x2="134" y2="180" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="142" y="150" class="l">messages in and out</text>
  <line x1="234" y1="218" x2="260" y2="218" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="362" y1="110" x2="362" y2="180" class="thin" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M440 182 L440 150 L590 150 L590 110" class="thin" marker-end="url(#a)"/>
  <text x="372" y="140" class="l">only unclear</text>
  <text x="372" y="154" class="l">messages</text>
  <text x="474" y="144" class="l">rare, daily limit</text>
  <line x1="464" y1="218" x2="488" y2="218" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="464" y1="306" x2="488" y2="306" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="260" y1="312" x2="238" y2="312" class="line" marker-end="url(#a)"/>
  <line x1="362" y1="332" x2="362" y2="382" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="372" y="362" class="l">status, chats, switches</text>
  <line x1="362" y1="480" x2="362" y2="546" class="line" marker-end="url(#a)" marker-start="url(#a)"/>

  <text x="20" y="642" class="l">Dashed arrows: called only when the code cannot decide.</text>
  <text x="20" y="658" class="l">Everything on the server is open source; keys and passwords stay in one locked file.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
