<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 620" role="img" aria-label="Floor plan of a small clinic or salon: waiting room and front desk at the entrance, two treatment rooms, a back office for the admin, a pantry, a toilet and a server closet holding the ISP router, the office router and two headless servers; cable runs in the ceiling to a Wi-Fi access point and the admin desk" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>an example office: a small clinic or salon with a front desk</title>
  <defs>
    <style>
      .wall{stroke:#334155;stroke-width:4;fill:none;stroke-linecap:square}
      .iw{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:square}
      .door{stroke:#94a3b8;stroke-width:.8;fill:none}
      .furn{fill:#e7e5e4;stroke:#78716c;stroke-width:.8}
      .wood{fill:#e9dcc9;stroke:#8b6f4e;stroke-width:.8}
      .soft{fill:#d6d3d1;stroke:#78716c;stroke-width:.8}
      .dev{fill:#cbd5e1;stroke:#0f172a;stroke-width:.9}
      .devk{fill:#334155;stroke:#0f172a;stroke-width:.9}
      .led{fill:#22c55e}
      .room{font-size:9px;font-weight:700;letter-spacing:.1em;fill:#78716c}
      .lb{font-size:6.5px;fill:#0f172a}
      .lbs{font-size:5.5px;fill:#475569}
      .lbk{font-size:7px;font-weight:700;fill:#0f172a}
      .cable{stroke:#0f172a;stroke-width:1.6;fill:none}
      .fibre{stroke:#7c3aed;stroke-width:1.6;fill:none}
      .cov{stroke:#64748b;stroke-width:.8;stroke-dasharray:3 4;fill:none}
      .wf{stroke:#64748b;stroke-width:.9;fill:none;stroke-linecap:round}
      .wg{stroke:#b45309;stroke-width:.9;fill:none;stroke-linecap:round}
    </style>

    <!-- devices, drawn top-down at their real proportions -->
    <symbol id="laptop" viewBox="0 0 30 20" overflow="visible">
      <rect x="3" y="0" width="24" height="13" rx="1.2" class="dev"/><rect x="5" y="1.6" width="20" height="9.8" fill="#0f766e" opacity=".55"/>
      <path d="M0 14 H30 L27.5 19.5 H2.5Z" class="dev"/>
    </symbol>
    <symbol id="phone" viewBox="0 0 8 14" overflow="visible"><rect width="8" height="14" rx="1.6" class="devk"/><rect x="1" y="1.6" width="6" height="10" fill="#94a3b8"/></symbol>
    <symbol id="tablet" viewBox="0 0 18 13" overflow="visible"><rect width="18" height="13" rx="1.6" class="devk"/><rect x="1.3" y="1.3" width="15.4" height="10.4" fill="#94a3b8"/></symbol>
    <symbol id="tower" viewBox="0 0 16 30" overflow="visible">
      <rect width="16" height="30" rx="1.5" class="devk"/><path d="M3 5H13M3 8H13M3 11H13" stroke="#94a3b8" stroke-width=".8"/><circle cx="12" cy="25" r="1.3" class="led"/>
    </symbol>
    <symbol id="router" viewBox="0 0 30 12" overflow="visible">
      <path d="M5 4 L2 -5M25 4 L28 -5M15 4 V-6" stroke="#0f172a" stroke-width="1.1"/>
      <rect y="3" width="30" height="9" rx="2" class="dev"/><circle cx="5" cy="7.5" r="1" class="led"/><circle cx="9" cy="7.5" r="1" class="led"/><circle cx="13" cy="7.5" r="1" class="led"/>
    </symbol>
    <symbol id="modem" viewBox="0 0 24 10" overflow="visible"><rect width="24" height="10" rx="2" fill="#f1f5f9" stroke="#0f172a" stroke-width=".9"/><circle cx="5" cy="5" r="1" class="led"/><circle cx="9" cy="5" r="1" fill="#f59e0b"/></symbol>
    <symbol id="ups" viewBox="0 0 16 20" overflow="visible"><rect width="16" height="20" rx="1.5" class="devk"/><rect x="3" y="3" width="10" height="4" fill="#22c55e" opacity=".7"/></symbol>
    <symbol id="ap" viewBox="-8 -8 16 16" overflow="visible"><circle r="7" fill="#f8fafc" stroke="#0f172a" stroke-width="1"/><circle r="2.2" fill="#0ea5e9"/></symbol>
    <symbol id="printer" viewBox="0 0 26 18" overflow="visible"><rect width="26" height="18" rx="2" class="dev"/><rect x="4" y="-3" width="18" height="5" fill="#fff" stroke="#0f172a" stroke-width=".7"/><rect x="5" y="11" width="16" height="3" fill="#64748b"/></symbol>
    <symbol id="tv" viewBox="0 0 70 6" overflow="visible"><rect width="70" height="5" rx="1" class="devk"/><rect x="25" y="5" width="20" height="2" fill="#334155"/></symbol>
    <symbol id="chair" viewBox="0 0 14 14" overflow="visible"><rect x="1" y="2" width="12" height="11" rx="3" class="soft"/><rect x="1" y="0" width="12" height="3.5" rx="1.5" fill="#a8a29e"/></symbol>
    <symbol id="plant" viewBox="-8 -8 16 16" overflow="visible"><circle r="6.5" fill="#bbf7d0" stroke="#15803d" stroke-width=".8"/><path d="M0 -6 V6 M-6 0 H6 M-4 -4 L4 4 M4 -4 L-4 4" stroke="#15803d" stroke-width=".6"/></symbol>
    <symbol id="wifi" viewBox="-6 -6 12 8" overflow="visible"><path d="M-5 -2 Q0 -7 5 -2M-3.3 -.3 Q0 -3.4 3.3 -.3" class="wf"/><circle cy="1.4" r=".9" fill="#64748b"/></symbol>
    <symbol id="wifig" viewBox="-6 -6 12 8" overflow="visible"><path d="M-5 -2 Q0 -7 5 -2M-3.3 -.3 Q0 -3.4 3.3 -.3" class="wg"/><circle cy="1.4" r=".9" fill="#b45309"/></symbol>
    <symbol id="bed" viewBox="0 0 34 80" overflow="visible"><rect width="34" height="80" rx="4" class="furn"/><rect x="5" y="4" width="24" height="12" rx="4" fill="#fff" stroke="#78716c" stroke-width=".6"/></symbol>

    <clipPath id="inside"><rect x="22" y="42" width="856" height="536"/></clipPath>
  </defs>

  <text x="22" y="16" font-size="10" font-weight="700" fill="#334155">example office · a small clinic or salon with a front desk</text>
  <text x="22" y="30" font-size="7" fill="#64748b">top-down floor plan, not to scale · network shown in the ceiling · zoom in for the small labels</text>

  <!-- floor -->
  <rect x="20" y="40" width="860" height="540" fill="#fafaf9"/>
  <rect x="337" y="345" width="258" height="122" fill="#ccfbf1" opacity=".65"/>
  <rect x="742" y="162" width="136" height="106" fill="#e2e8f0"/>

  <!-- wifi coverage from the ceiling access point -->
  <g clip-path="url(#inside)">
    <circle cx="430" cy="282" r="110" class="cov"/>
    <circle cx="430" cy="282" r="210" class="cov"/>
    <circle cx="430" cy="282" r="320" class="cov"/>
    <circle cx="430" cy="282" r="430" class="cov"/>
  </g>

  <!-- outer walls, with the entrance gap -->
  <path d="M230 580 H20 V40 H880 V580 H310" class="wall"/>
  <path d="M230 580 A38 38 0 0 1 268 542 M310 580 A42 42 0 0 0 268 542" class="door"/>
  <path d="M230 580 L268 545 M310 580 L268 545" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="270" y="598" text-anchor="middle" class="lb" font-weight="700">ENTRANCE</text>
  <text x="270" y="607" text-anchor="middle" class="lbs">glass double door</text>

  <!-- inner walls: top rooms / corridor at y 268..318 / bottom rooms -->
  <path d="M20 268 H200 M240 268 H300 M340 268 H620 M660 268 H780 M820 268 H880" class="iw"/>
  <path d="M280 40 V268 M600 40 V268 M740 40 V80 M740 112 V268 M740 160 H880" class="iw"/>
  <path d="M20 318 H150 M210 318 H480 M540 318 H700 M740 318 H880 M600 318 V580" class="iw"/>
  <!-- door swings -->
  <path d="M200 268 A40 40 0 0 0 240 228 M200 268 V228" class="door"/>
  <path d="M300 268 A40 40 0 0 0 340 228 M340 268 V228" class="door"/>
  <path d="M620 268 A40 40 0 0 0 660 228 M620 268 V228" class="door"/>
  <path d="M780 268 A40 40 0 0 1 820 228 M820 268 V228" class="door"/>
  <path d="M740 80 A32 32 0 0 1 772 112 M740 112 H772" class="door"/>
  <path d="M700 318 A40 40 0 0 1 740 358 M700 318 V358" class="door"/>
  <path d="M480 318 A30 30 0 0 0 510 348 M480 318 V348" class="door"/>

  <!-- room names -->
  <text x="34" y="58" class="room">ROOM 2 · TREATMENT / STYLING</text>
  <text x="294" y="58" class="room">BACK OFFICE · ADMIN</text>
  <text x="612" y="58" class="room">PANTRY</text>
  <text x="752" y="58" class="room">WC</text>
  <text x="750" y="176" class="room" font-size="8">SERVER CLOSET</text>
  <text x="34" y="288" class="room">CORRIDOR</text>
  <text x="34" y="358" class="room">WAITING ROOM</text>
  <text x="352" y="362" class="room" fill="#0f766e" style="fill:#0f766e">FRONT DESK</text>
  <text x="612" y="338" class="room">ROOM 1 · TREATMENT / STYLING</text>

  <!-- ROOM 2 -->
  <use href="#bed" x="110" y="90" width="34" height="80"/>
  <use href="#chair" x="160" y="120" width="14" height="14"/>
  <rect x="30" y="66" width="70" height="18" class="wood"/><circle cx="50" cy="75" r="5" fill="#fff" stroke="#78716c" stroke-width=".6"/>
  <text x="65" y="94" text-anchor="middle" class="lbs">sink · cabinet</text>
  <rect x="200" y="200" width="70" height="20" class="wood"/><text x="235" y="212" text-anchor="middle" class="lbs">trolley</text>
  <use href="#plant" x="30" y="236" width="16" height="16"/>

  <!-- BACK OFFICE -->
  <rect x="300" y="66" width="190" height="40" class="wood"/>
  <rect x="490" y="66" width="40" height="90" class="wood"/>
  <use href="#laptop" x="370" y="74" width="30" height="20"/>
  <use href="#tablet" x="410" y="78" width="18" height="13"/>
  <use href="#phone" x="436" y="77" width="8" height="14"/>
  <use href="#chair" x="378" y="110" width="14" height="14"/>
  <text x="364" y="88" text-anchor="end" class="lbk">lt-admin</text>
  <text x="419" y="100" text-anchor="middle" class="lbs">admin tablet · admin phone</text>
  <text x="385" y="138" text-anchor="middle" class="lbs">Linux, cable + Wi-Fi, opens the dashboards</text>
  <rect x="300" y="66" width="5" height="5" fill="#0f172a"/><text x="308" y="76" class="lbs">LAN port</text>
  <rect x="320" y="180" width="80" height="44" rx="22" class="wood"/>
  <use href="#chair" x="300" y="195" width="14" height="14"/><use href="#chair" x="406" y="195" width="14" height="14"/>
  <text x="360" y="205" text-anchor="middle" class="lbs">meeting table</text>
  <rect x="560" y="70" width="32" height="150" class="furn"/><text x="576" y="148" text-anchor="middle" class="lbs" transform="rotate(-90 576 148)">files · shelves</text>

  <!-- PANTRY + WC -->
  <rect x="604" y="66" width="130" height="22" class="furn"/><text x="669" y="80" text-anchor="middle" class="lbs">counter · sink · kettle</text>
  <rect x="706" y="96" width="28" height="30" class="furn"/><text x="720" y="114" text-anchor="middle" class="lbs">fridge</text>
  <rect x="630" y="150" width="50" height="34" rx="4" class="wood"/>
  <use href="#chair" x="614" y="160" width="14" height="14"/><use href="#chair" x="682" y="160" width="14" height="14"/>
  <rect x="840" y="70" width="22" height="30" rx="10" fill="#fff" stroke="#78716c" stroke-width=".8"/><rect x="790" y="66" width="30" height="16" rx="4" fill="#fff" stroke="#78716c" stroke-width=".8"/>

  <!-- SERVER CLOSET -->
  <rect x="770" y="186" width="100" height="80" fill="#f8fafc" stroke="#0f172a" stroke-width="1"/>
  <use href="#modem" x="776" y="198" width="24" height="10"/><text x="788" y="215" text-anchor="middle" class="lbs">ISP modem</text>
  <use href="#router" x="808" y="200" width="30" height="12"/><text x="842" y="205" class="lbs" font-weight="700">office</text><text x="842" y="211" class="lbs" font-weight="700">router</text>
  <use href="#ups" x="852" y="228" width="12" height="15"/><text x="858" y="251" text-anchor="middle" class="lbs">UPS</text>
  <use href="#tower" x="778" y="224" width="13" height="24"/><text x="785" y="255" text-anchor="middle" class="lb" font-weight="700">srv-main</text><text x="785" y="262" text-anchor="middle" class="lbs" font-size="5">hub · :8080</text>
  <use href="#tower" x="828" y="224" width="13" height="24"/><text x="835" y="255" text-anchor="middle" class="lb" font-weight="700">srv-llm</text><text x="835" y="262" text-anchor="middle" class="lbs" font-size="5">local LLM</text>
  <path d="M800 204 H808 M823 212 V222 H784 V224 M823 222 H834 V224" class="cable"/>

  <!-- fibre from the street, cable runs in the ceiling -->
  <path d="M930 190 H788 V198" class="fibre"/><text x="884" y="185" class="lbs" style="fill:#7c3aed">ISP fibre in</text>
  <path d="M823 200 V182 H758 Q752 182 752 188 V282 H438" class="cable"/>
  <path d="M752 282 H340 Q330 282 330 272 V120 Q330 110 320 110 H303 V71" class="cable"/>
  <use href="#ap" x="422" y="274" width="16" height="16"/>
  <text x="430" y="300" text-anchor="middle" class="lb" font-weight="700">ceiling Wi-Fi access point</text>
  <text x="430" y="308" text-anchor="middle" class="lbs">staff SSID + guest SSID (VLAN)</text>

  <!-- WAITING ROOM -->
  <use href="#tv" x="40" y="322" width="70" height="6"/>
  <text x="75" y="336" text-anchor="middle" class="lbs">waiting-room TV · promo loop</text>
  <use href="#wifig" x="114" y="320" width="12" height="8"/>
  <rect x="40" y="410" width="110" height="30" rx="6" class="soft"/><rect x="40" y="436" width="110" height="8" rx="3" fill="#a8a29e"/>
  <text x="95" y="428" text-anchor="middle" class="lbs">sofa</text>
  <rect x="60" y="372" width="70" height="26" rx="4" class="wood"/><text x="95" y="388" text-anchor="middle" class="lbs">coffee table · magazines</text>
  <use href="#chair" x="180" y="470" width="14" height="14"/><use href="#chair" x="198" y="470" width="14" height="14"/><use href="#chair" x="216" y="470" width="14" height="14"/>
  <use href="#chair" x="290" y="400" width="14" height="14"/><use href="#chair" x="290" y="418" width="14" height="14"/>
  <use href="#phone" x="70" y="414" width="6" height="10"/><use href="#phone" x="118" y="414" width="6" height="10"/>
  <use href="#wifig" x="96" y="460" width="12" height="8"/>
  <text x="102" y="475" text-anchor="middle" class="lbs" style="fill:#b45309">visitors' phones: guest Wi-Fi, internet only</text>
  <rect x="30" y="540" width="20" height="30" class="furn"/><text x="58" y="560" class="lbs">water</text>
  <use href="#plant" x="170" y="556" width="16" height="16"/><use href="#plant" x="34" y="490" width="16" height="16"/>
  <rect x="180" y="520" width="40" height="12" class="wood"/><text x="200" y="540" text-anchor="middle" class="lbs">brochures</text>

  <!-- FRONT DESK -->
  <path d="M350 450 H580 V380 H560 V430 H350Z" class="wood"/>
  <text x="455" y="444" text-anchor="middle" class="lbs">reception counter (customers stand on this side)</text>
  <use href="#laptop" x="430" y="404" width="30" height="20"/>
  <text x="445" y="399" text-anchor="middle" class="lbk" style="fill:#0f766e">lt-desk</text>
  <use href="#phone" x="470" y="408" width="8" height="14"/><text x="487" y="418" class="lbs">fdp phone</text>
  <use href="#wifi" x="414" y="404" width="12" height="8"/>
  <use href="#chair" x="438" y="374" width="14" height="14" transform="rotate(180 445 381)"/>
  <text x="405" y="384" text-anchor="end" class="lbs">fdp</text>
  <rect x="345" y="322" width="120" height="18" class="furn"/>
  <use href="#printer" x="352" y="321" width="22" height="15"/><use href="#wifi" x="380" y="326" width="12" height="8"/>
  <text x="420" y="334" class="lbs">printer · fixed IP</text>
  <text x="510" y="370" text-anchor="middle" class="lbs">staff door</text>
  <text x="470" y="464" text-anchor="middle" class="lbs" style="fill:#0f766e">web-browser bot as a systemd service · 09:00–17:00, then srv-main takes over</text>
  <use href="#plant" x="584" y="458" width="14" height="14"/>

  <!-- ROOM 1 -->
  <use href="#bed" x="700" y="410" width="34" height="80" transform="rotate(90 717 450)"/>
  <use href="#chair" x="760" y="500" width="14" height="14"/>
  <rect x="826" y="330" width="46" height="60" class="wood"/><circle cx="849" cy="345" r="5" fill="#fff" stroke="#78716c" stroke-width=".6"/>
  <text x="849" y="378" text-anchor="middle" class="lbs">sink · cabinet</text>
  <rect x="620" y="540" width="80" height="30" class="furn"/><text x="660" y="558" text-anchor="middle" class="lbs">mirror · trolley</text>
  <use href="#plant" x="860" y="560" width="16" height="16"/>

  <!-- legend -->
  <g transform="translate(600 592)">
    <path d="M0 4 H22" class="cable"/><text x="26" y="7" class="lbs">cable in the ceiling</text>
    <path d="M100 4 H122" class="fibre"/><text x="126" y="7" class="lbs">ISP fibre</text>
    <circle cx="180" cy="4" r="6" class="cov"/><text x="190" y="7" class="lbs">Wi-Fi coverage</text>
    <use href="#wifig" x="236" y="0" width="10" height="7"/><text x="250" y="7" class="lbs">guest only</text>
  </g>
  <g transform="translate(600 606)">
    <rect x="0" y="-1" width="22" height="9" fill="#ccfbf1"/><text x="26" y="7" class="lbs">the front desk</text>
    <use href="#wifi" x="96" y="0" width="10" height="7"/><text x="110" y="7" class="lbs">staff Wi-Fi device</text>
  </g>
</svg>
