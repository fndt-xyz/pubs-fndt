    .x { font: 700 11px system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; fill: #0f766e; }
    .i { font: italic 400 13.5px system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; fill: #1e293b; }
    .f { font: 400 11.5px system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; fill: #475569; }
    .ln { stroke: #94a3b8; stroke-width: 1.4; fill: none; }
    .dl { stroke: #94a3b8; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
