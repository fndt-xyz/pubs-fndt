  <title
     id="t">Automation &amp; AI (A2A, agent to agent) on Matrix</title>
  <desc
     id="d">Buyer side and merchant side each run their own AI-enhanced bot with their own dashboard. The two bots talk in a Matrix room. Client and merchant have no direct line, and a person on each side can step in.</desc>
