<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pubs.fndt.xyz | All Contents</title>
    
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../global.css">
</head>
<body class="antialiased">

    <div id="navbar-placeholder"></div>

    <main class="view-container">
        <div class="grid-two-one">
            
            <div class="left-col">
                <section class="view-card">
                    <h1 class="view-title">directory index</h1>
                    <hr class="title-sep">

                    <nav class="breadcrumb">
                        <div class="crumb-line">
                            &gt; <a href="/index.html">pubs</a> &gt; 
                            <span class="current" id="folder-name">contents</span>
                        </div>
                    </nav>

                    <div class="view-content">
                        <p>Automated list of all technical papers in this directory:</p>
                        
                        <ul id="file-list" class="list-flush" style="line-height: 2;">
                            <li>Loading files...</li>
                        </ul>
                    </div>
                </section>
            </div>

            <div class="right-col">
                <div id="sidebar-placeholder"></div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        // COMPONENT LOADER (Your Master Logic)
        async function loadComponent(id, file) {
            const element = document.getElementById(id);
            if (!element) return;
            try {
                const response = await fetch(`../${file}`);
                if (response.ok) {
                    const data = await response.text();
                    element.innerHTML = data;
                }
            } catch (error) { console.error("Error:", file, error); }
        }

        // FOLDER SCANNER: lists every .html page in the folder this index.html sits in.
        // to use it for a new category: make a folder, copy this file into it unchanged, add pages. nothing to edit.
        // live site: asks the GitHub API for the folder's files (60 requests per hour per visitor).
        // localhost (./start.sh): reads the folder listing python's server makes, so you can test before pushing.
        const owner = "fndt-xyz";
        const repo = "pubs-fndt";
        const folder = location.pathname.replace(/[^/]*$/, '').replace(/^\/|\/$/g, '');   // e.g. "contents"

        async function listNames() {
            const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
            if (local) {
                const html = await (await fetch('./?list')).text();
                return [...new DOMParser().parseFromString(html, 'text/html').querySelectorAll('a')]
                    .map(a => decodeURIComponent(a.getAttribute('href')));
            }
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`);
            if (!response.ok) throw new Error(response.status === 403 ? 'GitHub limit reached, try again in an hour.' : 'HTTP ' + response.status);
            return (await response.json()).filter(f => f.type === 'file').map(f => f.name);
        }

        async function loadFiles() {
            const listElement = document.getElementById('file-list');
            document.getElementById('folder-name').textContent = folder;
            try {
                const names = (await listNames())
                    .filter(n => n.endsWith('.html') && n !== 'index.html' && !n.includes('/'))
                    .sort();
                listElement.innerHTML = '';
                if (!names.length) listElement.innerText = 'No pages in this folder yet.';
                names.forEach(name => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = name;
                    a.textContent = name.replace('.html', '').replace(/-/g, ' ');   // page-06-01-reuse.html -> page 06 01 reuse
                    li.innerHTML = '<strong>&gt;</strong> ';
                    li.appendChild(a);
                    listElement.appendChild(li);
                });
            } catch (e) {
                listElement.innerText = 'Error loading directory. ' + (e.message || '');
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadComponent('navbar-placeholder', 'navbar.html');
            loadComponent('footer-placeholder', 'footer.html');
            loadComponent('sidebar-placeholder', 'rght-clmn.html');
            loadFiles(); // Runs the scanner
        });
    </script>
</body>
</html>
