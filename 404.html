<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pubs.fndt.xyz | 404</title>
    <!--
      404: GitHub Pages shows this file for any address that does not exist, at any folder depth.
      so every path here starts with "/" (relative paths would break inside /contents/... or deeper).
      on localhost (./start.sh) python shows its own error instead; to see this page open /404.html directly.
    -->
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/global.css">
</head>
<body class="antialiased">

    <div id="navbar-placeholder"></div>

    <main class="view-container">
        <div class="grid-two-one">

            <div class="left-col">
                <section class="view-card">
                    <h1 class="view-title">page not found</h1>
                    <hr class="title-sep">

                    <nav class="breadcrumb">
                        <div class="crumb-line">
                            &gt; <a href="/index.html">pubs</a> &gt;
                            <span class="current">404</span>
                        </div>
                    </nav>

                    <div class="view-content">
                        <p>
                            nothing lives at this address. it may have moved, been renamed, or never existed.
                        </p>
                        <p><code id="missing-path"></code></p>
                        <p>
                            &gt; <a href="/index.html" class="plain-link">home</a>
                        </p>
                        <p>
                            &gt; <a href="/all-pages.html" class="plain-link">all pages</a>
                        </p>
                    </div>
                </section>
            </div>

            <div class="right-col">
                <div id="sidebar-placeholder"></div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        async function loadComponent(id, file) {
            const element = document.getElementById(id);
            if (!element) return;
            try {
                const response = await fetch(file);
                if (response.ok) element.innerHTML = await response.text();
            } catch (error) { console.error("Error loading component:", file, error); }
        }

        document.addEventListener("DOMContentLoaded", () => {
            // the address the visitor typed, shown raw (textContent: nothing in it can run as code)
            document.getElementById('missing-path').textContent = decodeURIComponent(location.pathname);
            loadComponent('navbar-placeholder', '/navbar.html');
            loadComponent('footer-placeholder', '/footer.html');
            loadComponent('sidebar-placeholder', '/rght-clmn.html');
        });
    </script>
</body>
</html>
